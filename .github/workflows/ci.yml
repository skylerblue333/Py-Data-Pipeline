name: dataflow-ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install product and verification tools
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[test]' ruff pip-audit
      - name: Compile
        run: python -m compileall -q pipeline.py tests
      - name: Lint
        run: ruff check pipeline.py tests
      - name: Test
        run: pytest -q
      - name: Audit dependencies
        run: pip-audit
      - name: Build container
        run: docker build -t sky-dataflow:ci .
      - name: Verify non-root image
        run: test -n "$(docker image inspect sky-dataflow:ci --format '{{.Config.User}}')"
